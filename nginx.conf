log_format upstreamlog '$remote_addr - [$time_local] "$request" $status '
                       '-> upstream: $upstream_addr ($upstream_response_time s)';

upstream app_backend {
    # ==========================================================
    # PILIHAN ALGORITMA LOAD BALANCING (G.1.3 & G.2):
    # 1. Round Robin      : Hapus/komentari least_conn; dan ip_hash;
    # 2. Least Connection : Aktifkan least_conn;
    # 3. IP Hash          : Aktifkan ip_hash; (Pilihan Final Studi Kasus 8)
    # ==========================================================
    ip_hash;
    # least_conn;

    server app1:3000;
    server app2:3000;
}

server {
    listen 80;
    listen 443 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # OWASP Security Headers (Wajib sesuai G.3.7 & G.4)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'" always;

    access_log /var/log/nginx/access.log upstreamlog;

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://app_backend/health;
    }
}